services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    volumes:
      - "kafka_data:/var/lib/kafka/data"
    networks:
      - social_media-network
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=CONTROLLER://:9093,PLAINTEXT://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
  kafbat-ui:
    container_name: kafbat-ui
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - 8090:8080
    depends_on:
      - kafka
    networks:
      - social_media-network
    environment:
      KAFKA_CLUSTERS_O_NAME: local
      KAFKA_CLUSTERS_O_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_O_KSQLDBSERVER: http://ksqldbO:8088
  notification-db:
    image: postgres:17-alpine
    container_name: notification-db
    environment:
      POSTGRES_DB: notificationsdb
      POSTGRES_USER: harshraj
      POSTGRES_PASSWORD: Harsh@1234
    networks:
      - social_media-network
    volumes:
      - notification-db-data:/var/lib/postgresql

  discovery-service:
    image: harsh3417/discovery-service:0.0.1-SNAPSHOT
    container_name: discovery-server
    networks:
      - social_media-network
    ports:
      - "8761:8761"

  notification-service:
    image: harsh3417/notification-service:0.0.1-SNAPSHOT
    container_name: notification-service
    networks:
      - social_media-network
    depends_on:
      - discovery-service
      - notification-db
      - kafka

  posts-db:
    image: postgres:17-alpine
    container_name: posts-db
    environment:
      POSTGRES_DB: postsDB
      POSTGRES_USER: harshraj
      POSTGRES_PASSWORD: Harsh@1234
    networks:
      - social_media-network
    volumes:
      - posts-db-data:/var/lib/postgresql
  users-DB:
    image: postgres:17-alpine
    container_name: users-DB
    environment:
      POSTGRES_DB: usersDB
      POSTGRES_USER: harshraj
      POSTGRES_PASSWORD: Harsh@1234
    networks:
      - social_media-network
    volumes:
      - users-DB-data:/var/lib/postgresql
  connections-db:
    image: neo4j
    container_name: connections-db
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - social_media-network
    volumes:
      - connections-db-data:/data
  posts-service:
    image: harsh3417/post-service:0.0.1-SNAPSHOT
    container_name: posts-service
    networks:
      - social_media-network
    depends_on:
      - discovery-service
      - posts-db
      - kafka
  connections-service:
    image: harsh3417/post-service:0.0.1-SNAPSHOT
    container_name: connections-service
    networks:
      - social_media-network
    depends_on:
      - discovery-service
      - connections-db
      - kafka

  api-gateway:
    image: harsh3417/api-gateway:0.0.1-SNAPSHOT
    container_name: api-gateway
    networks:
      - social_media-network
    depends_on:
      - discovery-service
  user-service:
    image: harsh3417/user-service:0.0.1-SNAPSHOT
    container_name: users-service
    networks:
      - social_media-network
    depends_on:
      - discovery-service
      - users-DB
      - kafka


networks:
  social_media-network:

volumes:
  kafka_data:
  notification-db-data:
  posts-db-data:
  users-DB-data:
  connections-db-data:
